$kind: http-request
name: List Curricula
order: 1000
method: GET
url: '{{baseUrl}}/curricula'
queryParams:
  - key: page
    value: '1'
  - key: limit
    value: '20'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Successful response', () => pm.expect(pm.response.code).to.eql(200));
      pm.test('Standard response envelope', () => pm.expect(pm.response.json()).to.have.property('success', true));
